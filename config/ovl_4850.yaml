name: OVL_4850
options:
  basename: ovl_4850
  target_path: disc/OVL_4850.BIN
  elf_path: build/ovl_4850.elf
  base_path: ..
  platform: psx
  compiler: GCC
  asm_path: asm/ovl_4850
  src_path: src/ovl_4850
  build_path: build
  ld_script_path: build/ovl_4850.ld
  ld_dependencies: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  ld_bss_is_noload: False
  find_file_boundaries: False
  o_as_suffix: True
  use_legacy_include_asm: False
  section_order: [".text", ".rodata", ".data", ".bss"]
  symbol_addrs_path: [config/symbols.ovl_4850.txt, config/symbols.mainexe_for_ovl.txt]
  undefined_funcs_auto_path: config/undefined_funcs_auto.ovl_4850.txt
  undefined_syms_auto_path: config/undefined_syms_auto.ovl_4850.txt
  subalign: 2
  string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
segments:
  - name: ovl_4850
    type: code
    start: 0x0
    vram: 0x8002F824
    subsegments:
      - [0x0, c, ovl_4850]       # game code
      - [0xAC14, asm, psyq]        # PsyQ libs (signature-matched)
      - [0xBAC4, rodata]           # jump tables, then data
  - [0x1581C]
